<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .header {
   background-color: purple;
   font-size: 15px;
   padding: 10px;
   margin: 10px;
  color: white;
  border-radius: 10px;
  max-width: 280px;
  text-align: center;
 }
 .container div {
  background-color: #f1f1f1;
  padding: 40px;
  font-size: 24px;
  display: flex;
  background-color: DodgerBlue;
  max-width: 70px;
  margin: 25px;
}
.arrow{
    max-width: 100px;
    max-height: 250px;
    font-size: 80px;
    color: blueviolet;
    padding: 10px;
    margin: 10px;
}
</style>
<body>
    <h1>Responsive Web Design</h1>
    <p>Flexbox + Media Queries = Responsive layout</p>
    <div class="header" style="text-align: center;">
        <h2>Desktop Layout-3 Columns</h2>
    </div>
    <div class="container">
  <div>Box 1</div>
  <div>Box 2</div>
  <div>Box 3</div>  
 </div>

 <div class="arrow">
  <div class="arrow">↓</div>
</div>
<div class="header" style="text-align: center;">
        <h2>Mobile Layout-1 Column</h2>
    </div>

    <div class="container">
  <div>Box 1</div>
  <div>Box 2</div>
  <div>Box 3</div>  
 </div>
    
</body>
</html>
